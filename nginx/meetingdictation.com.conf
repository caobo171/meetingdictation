# meetingdictation.com — MeetingDictation (Next.js, repo /root/meetingdictation/apps/web).
#
# Upstream: PM2 process `meetingdictation.web` on 127.0.0.1:4100.
# Data (SQLite + uploaded recordings) lives in /root/meetingdictation-data.
# TLS: Let's Encrypt cert `meetingdictation.com` (apex + www), renewed by certbot.
# meetingdictation\.com is also excluded in custom-domains.wele-learn.conf so that
# undeclared names never fall through to WELE.

# http -> https; ACME challenges stay on http for renewal.
server {
    listen 80;
    listen [::]:80;
    server_name meetingdictation.com www.meetingdictation.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://meetingdictation.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.meetingdictation.com;

    ssl_certificate     /etc/letsencrypt/live/meetingdictation.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meetingdictation.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://meetingdictation.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name meetingdictation.com;

    ssl_certificate     /etc/letsencrypt/live/meetingdictation.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meetingdictation.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The app accepts recordings up to 1 GB.
    client_max_body_size 1100M;

    location /_next/static/ {
        proxy_pass       http://127.0.0.1:4100;
        proxy_set_header Host $host;
        add_header       Cache-Control "public, max-age=31536000, immutable";
    }

    # Uploads: stream the body to Next instead of buffering it on disk first.
    location = /api/recordings {
        proxy_pass              http://127.0.0.1:4100;
        proxy_http_version      1.1;
        proxy_request_buffering off;
        proxy_read_timeout      600s;
        proxy_send_timeout      600s;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}
